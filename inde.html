<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>多益每日三題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one column (max 48rem). Sentences are shown as rows of word tiles; explanations re-assemble those tiles.
   Four-colour memory scheme: blue = words to remember, yellow = hint / look here / mismatch, green = why (understanding), red = core answer & rule. */
:root{
  --bg:#f3f6ff; --surface:#ffffff; --ink:#1c2333; --muted:#5d687d; --line:#dbe2f2; --tile:#eef2fb; --shadow:#d3dbee;
  --blue:#2f66f5; --blue-ink:#1f4fd0; --blue-soft:#e4ecff;
  --yellow:#ffc53d; --yellow-ink:#8a5a00; --yellow-soft:#fff3cc;
  --green:#18a866; --green-ink:#11774a; --green-soft:#ddf5e8;
  --red:#f04857; --red-ink:#c42634; --red-soft:#ffe4e7;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-en:"Nunito","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-doc:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151f; --surface:#1a2030; --ink:#e8ecf5; --muted:#a0abc0; --line:#2c3549; --tile:#232b3d; --shadow:#0b0e15;
  --blue:#7c9dff; --blue-ink:#a9c0ff; --blue-soft:#1d2a4c;
  --yellow:#ffcf5a; --yellow-ink:#ffd978; --yellow-soft:#3a3016;
  --green:#4cd696; --green-ink:#7ee3b2; --green-soft:#153529;
  --red:#ff7883; --red-ink:#ff9aa3; --red-soft:#3f1d24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151f; --surface:#1a2030; --ink:#e8ecf5; --muted:#a0abc0; --line:#2c3549; --tile:#232b3d; --shadow:#0b0e15;
  --blue:#7c9dff; --blue-ink:#a9c0ff; --blue-soft:#1d2a4c;
  --yellow:#ffcf5a; --yellow-ink:#ffd978; --yellow-soft:#3a3016;
  --green:#4cd696; --green-ink:#7ee3b2; --green-soft:#153529;
  --red:#ff7883; --red-ink:#ff9aa3; --red-soft:#3f1d24; color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6}
.wrap{max-width:48rem;margin:0 auto;padding-inline:16px;padding-block:18px 64px}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.3}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
svg.i{width:14px;height:14px;flex:0 0 auto;vertical-align:-2px}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px;background:var(--surface);box-shadow:0 2px 0 var(--shadow)}
.logo i{border-radius:4px}
.eyebrow{font-size:.78rem;color:var(--muted);letter-spacing:.06em}
h1{font-size:1.4rem;font-weight:900}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem;box-shadow:0 2px 0 var(--shadow)}
.btn:hover{border-color:var(--blue)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{box-shadow:none}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;border-radius:999px;padding:3px 10px;font-weight:500}
.lg-b{background:var(--blue-soft);color:var(--blue-ink)}
.lg-y{background:var(--yellow-soft);color:var(--yellow-ink)}
.lg-g{background:var(--green-soft);color:var(--green-ink)}
.lg-r{background:var(--red-soft);color:var(--red-ink)}

/* days */
nav.days{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
nav.days button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;cursor:pointer;text-align:left;min-width:4.4rem;box-shadow:0 2px 0 var(--shadow)}
nav.days .d{display:block;font-weight:900}
nav.days .t{display:block;font-size:.75rem;color:var(--muted)}
nav.days button[aria-current="true"]{border-color:var(--blue);background:var(--blue-soft)}
nav.days .ok{color:var(--green-ink);font-weight:700}

.dayhead{margin-top:20px;display:flex;gap:14px;align-items:center}
.badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:1.3rem;color:#fff;flex:0 0 auto;box-shadow:0 3px 0 var(--shadow)}
.dayhead h2{font-size:1.2rem;font-weight:900}
.dayhead p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.progress{display:flex;gap:6px;margin-top:6px}
.progress i{width:26px;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--green)}
.progress i.half{background:var(--yellow)}

/* passages */
.passage{margin-top:14px;background:var(--surface);border-radius:16px;padding:16px 18px;font-family:var(--f-doc);font-size:1.02rem;line-height:1.75;box-shadow:0 2px 0 var(--shadow);border:1.5px solid var(--line)}
.passage .meta{font-family:var(--f-ui);font-size:.82rem;color:var(--muted);display:grid;gap:1px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.passage h3{font-family:var(--f-doc);font-size:1.1rem;margin-bottom:6px}
.blank{display:inline-block;min-width:2.6em;padding:0 6px;border-radius:8px;background:var(--blue-soft);color:var(--blue-ink);text-align:center;font-family:var(--f-en);font-size:.85rem;font-weight:800}

/* question card */
.qlist{display:grid;gap:18px;margin-top:16px}
.q{background:var(--surface);border-radius:18px;padding:16px;display:grid;gap:14px;min-width:0;border:1.5px solid var(--line);box-shadow:0 3px 0 var(--shadow)}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.qnum{font-weight:900;font-size:.95rem}
.tag{font-size:.75rem;border-radius:999px;padding:2px 10px;background:var(--tile);color:var(--muted);font-weight:500}
.ask{font-size:.92rem;color:var(--muted)}

/* tiles */
.tiles{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:flex-start}
.tile{display:inline-flex;flex-direction:column;align-items:center;gap:3px;max-width:100%}
.tile .w{font-family:var(--f-en);font-weight:700;font-size:1.02rem;line-height:1.35;background:var(--tile);border:2px solid transparent;border-radius:12px;padding:6px 10px;box-shadow:0 2px 0 var(--shadow);text-align:center;max-width:100%;overflow-wrap:anywhere}
.tile .r{font-size:.72rem;color:var(--muted);display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.tile.slot .w{background:var(--blue-soft);border:2px dashed var(--blue);color:var(--blue-ink);min-width:4.2em}
.tile.clue .w{background:var(--yellow-soft);border-color:var(--yellow)}
.tile.clue .r{color:var(--yellow-ink);font-weight:700}
.tile.kw .w{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.tile.ans .w{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.tile.ans .r{color:var(--red-ink);font-weight:700}
.tile.bad .w{background:var(--yellow-soft);border:2px dashed var(--yellow);color:var(--yellow-ink);text-decoration:line-through}
.tile.mod .w{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);font-weight:500}
.tile.core .w{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.trimmed .tile.mod{opacity:.35}
.trimmed .tile.mod .w{text-decoration:line-through}
.trimmed .tile.sv .w{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.tile .pair{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:.7rem;font-family:var(--f-en);font-weight:800}
.plus{align-self:center;color:var(--muted);font-weight:900;font-family:var(--f-en);padding-bottom:18px}

/* options as tiles */
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts.long{display:grid;grid-template-columns:1fr}
.opt{display:flex;gap:8px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 14px;cursor:pointer;font-family:var(--f-en);font-weight:700;font-size:1rem;line-height:1.35;min-height:46px;box-shadow:0 3px 0 var(--shadow);transition:transform .08s}
.opts:not(.long) .opt{flex:1 1 calc(50% - 10px);min-width:8rem}
.opt:hover:not([disabled]){border-color:var(--blue);background:var(--blue-soft)}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.opt .k{font-family:var(--f-en);font-weight:800;color:var(--muted);flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-size:.8rem}
.opt[disabled]{cursor:default}
.opt.wrong{border-style:dashed;color:var(--muted);box-shadow:none;text-decoration:line-through}
.opt.wrong .k{background:var(--yellow-soft);color:var(--yellow-ink)}
.opt.right{border-color:var(--red);background:var(--red-soft);color:var(--red-ink)}
.opt.right .k{background:var(--red);color:#fff}


/* plain stem */
.stem{font-family:var(--f-doc);font-size:1.08rem;line-height:1.7}
.stem em{font-style:italic}
.gap-line{color:var(--blue-ink);font-weight:600;letter-spacing:.05em}
/* sentence cutter */
.cutter{display:flex;flex-wrap:wrap;align-items:center;row-gap:8px;background:var(--surface);border-radius:12px;padding:12px 10px;font-family:var(--f-en);font-weight:700;font-size:1.05rem}
.cw{padding:2px 2px}
.cw.blankw{color:var(--blue-ink)}
.gapb{border:0;background:transparent;cursor:pointer;width:22px;height:34px;display:inline-grid;place-items:center;color:var(--muted);font-weight:900;border-radius:6px;padding:0}
.gapb:hover{background:var(--blue-soft);color:var(--blue-ink)}
.gapb.on{color:var(--blue);font-size:1.3rem}
.cutter.cmp .sp{display:inline-block;width:8px}
.mark{display:inline-grid;place-items:center;width:20px;height:30px;font-weight:900;font-size:1.2rem;border-radius:6px}
.mark.hit{color:var(--green-ink)}
.mark.miss{color:var(--yellow-ink);background:var(--yellow-soft);outline:2px dashed var(--yellow)}
.mark.extra{color:var(--yellow-ink);font-size:.95rem}
.legend2{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem}
.legend2 .m.hit{color:var(--green-ink)} .legend2 .m.miss{color:var(--yellow-ink)} .legend2 .m.extra{color:var(--yellow-ink)}
.sub2{font-size:.85rem;font-weight:700;color:var(--yellow-ink)}
.hinttext{background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.93rem}


.steps{margin:0;padding-left:1.3em;display:grid;gap:2px;font-size:.92rem}
.example{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:.85rem}
.exlab{font-size:.75rem;font-weight:700;color:var(--yellow-ink);margin-right:4px}
.example .wv{font-family:var(--f-en);font-weight:700;padding:2px 6px}
.cutter2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 2px;background:var(--surface);border-radius:12px;padding:12px 10px}
.grp{display:inline-flex;flex-wrap:wrap;align-items:center;border-radius:12px;padding:3px;border:2px solid var(--blue)}
.grp.g0{background:var(--blue-soft)}
.grp.g1{background:var(--surface)}
.grp:empty{display:none}
.wbtn{border:0;background:transparent;font-family:var(--f-en);font-weight:700;font-size:1.05rem;padding:6px 7px;border-radius:8px;cursor:pointer;min-height:40px;color:var(--ink)}
.wbtn:hover:not([disabled]){background:var(--yellow-soft)}
.wbtn[aria-pressed="true"]{color:var(--blue-ink)}
.wbtn[disabled]{cursor:default}
.wbtn.blankw{color:var(--blue-ink)}
.scis{color:var(--red-ink);font-weight:900;font-size:1.05rem;padding:0 3px}


.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag.lv{background:var(--blue-soft);color:var(--blue-ink)}
.say{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.85rem;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 0 var(--shadow);color:var(--blue-ink)}
.say:hover{border-color:var(--blue)}
.playbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rates{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.listen-p{background:var(--blue-soft);margin-top:18px}
.listen-p h4{color:var(--blue-ink)}
.lines{display:grid;gap:6px}
.line{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border-radius:10px;padding:8px 10px;border:2px solid transparent}
.line.on{border-color:var(--yellow);background:var(--yellow-soft)}
.wwrap{display:grid;gap:6px;justify-items:center}
.vlist{display:grid;gap:6px;max-height:320px;overflow:auto}
.vitem{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:.9rem}
.linebar{margin-top:12px;background:var(--yellow-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:.9rem;max-width:calc(100% - 32px);z-index:5}
.ok-b{color:var(--red-ink)}

/* feedback panels */
.panel{border-radius:16px;padding:14px;display:grid;gap:10px}
.panel h4{font-size:.92rem;display:flex;align-items:center;gap:6px;font-weight:900}
.hint{background:var(--yellow-soft)}
.hint h4{color:var(--yellow-ink)}
.core-p{background:var(--red-soft)}
.core-p h4{color:var(--red-ink)}
.why{background:var(--green-soft)}
.why h4{color:var(--green-ink)}
.explain{display:grid;gap:12px}
.sub{font-size:.82rem;font-weight:700;color:var(--green-ink)}
.tryrow{display:grid;gap:6px;background:var(--surface);border-radius:12px;padding:10px 12px}
.tryrow .because{font-size:.92rem;display:flex;gap:6px;align-items:flex-start}
.tryrow .because b{color:var(--yellow-ink)}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border-radius:999px;padding:4px 12px;font-weight:900;font-size:.9rem}
.pill.good{background:var(--red-soft);color:var(--red-ink)}
.pill.miss{background:var(--tile);color:var(--muted)}
details.more{border-radius:12px;background:var(--surface);padding:0 12px}
details.more summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--green-ink);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"＋ "}
details.more[open] summary::before{content:"－ "}
details.more .body{padding-bottom:12px;display:grid;gap:8px;font-size:.93rem}
.en{font-family:var(--f-en);font-weight:700}

/* connector diagram (transitions) */
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.scard{background:var(--surface);border-radius:12px;padding:10px 12px;font-family:var(--f-en);font-weight:600;font-size:.95rem;display:grid;gap:4px}
.scard .mood{font-family:var(--f-ui);font-size:.78rem;font-weight:700}
.mood.up{color:var(--green-ink)} .mood.down{color:var(--yellow-ink)}
.link{display:grid;place-items:center;gap:2px;text-align:center}
.link .w{font-family:var(--f-en);font-weight:800;background:var(--red-soft);color:var(--red-ink);border:2px solid var(--red);border-radius:12px;padding:6px 10px}
.link .r{font-size:.75rem;color:var(--green-ink);font-weight:700}
@media (max-width:560px){.flow{grid-template-columns:1fr}.link{grid-auto-flow:column;justify-content:start;gap:8px}}

.ruleline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* done + word cards */
.done{margin-top:18px;border-radius:18px;padding:16px;display:grid;gap:4px;background:var(--surface);border:2px solid var(--green);box-shadow:0 3px 0 var(--shadow)}
.done strong{font-size:1.05rem}
.small{font-size:.85rem;color:var(--muted)}
.section-title{margin-top:24px;font-size:1.05rem;font-weight:900}
.note{background:var(--yellow-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.9rem;margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.wcard{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 12px;min-height:118px;cursor:pointer;display:grid;align-content:center;justify-items:center;gap:6px;box-shadow:0 3px 0 var(--shadow);text-align:center}
.wcard .w{font-family:var(--f-en);font-size:1.2rem;font-weight:800;color:var(--blue-ink)}
.wcard .c{font-family:var(--f-en);font-size:.85rem;color:var(--muted);font-weight:600}
.wcard .zh{font-size:1.15rem;font-weight:900;color:var(--red-ink)}
.wcard.flipped{border-color:var(--red);background:var(--red-soft)}

.rest{margin-top:18px;background:var(--surface);border-radius:18px;padding:30px 20px;text-align:center;display:grid;gap:8px;justify-items:center;box-shadow:0 3px 0 var(--shadow)}
.book{display:grid;gap:10px;margin-top:12px}
.bitem{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:.9rem;box-shadow:0 2px 0 var(--shadow)}
.bitem .lab{color:var(--muted)}
.dialog{margin-top:16px;background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:10px;box-shadow:0 2px 0 var(--shadow)}
textarea{width:100%;box-sizing:border-box;min-height:90px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.score{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .panel,.done{animation:pop .28s ease-out}
  .tile.ans .w,.tile.bad .w{animation:drop .3s ease-out}
  .trimmed .tile{transition:opacity .35s}
}
@keyframes pop{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes drop{from{transform:translateY(-8px) scale(.94)}to{transform:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><i style="background:var(--blue)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i><i style="background:var(--red)"></i></div>
      <div>
        <div class="eyebrow">第 1 週・詞性判斷 × 辦公室與會議</div>
        <h1>多益每日三題</h1>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn" id="btn-book" type="button">錯題本 <span id="book-count" class="score">0</span></button>
      <button class="btn" id="btn-voice" type="button">🔊 聲音</button>
      <button class="btn" id="btn-backup" type="button">備份／還原</button>
    </div>
  </header>
  <div class="legend" aria-label="顏色說明">
    <span class="lg-b">藍＝要記住的字</span>
    <span class="lg-y">黃＝看這裡、不合</span>
    <span class="lg-g">綠＝為什麼</span>
    <span class="lg-r">紅＝正解與核心</span>
  </div>
  <div class="linebar" id="linebar" hidden>你正在 LINE 裡開啟，聲音可能不穩定。建議按右上角「⋯」選「用瀏覽器開啟」。</div>
  <nav class="days" id="days" aria-label="選擇星期"></nav>
  <div class="toast" id="toast" role="status" hidden></div>
  <main id="main"></main>
</div>

<script>
(function(){
"use strict";

function iconFor(r){
  if(!r) return "";
  if(/看這裡/.test(r)) return IC.eye;
  if(/代名詞|主格|受格|所有格|人/.test(r)) return IC.person;
  if(/副詞/.test(r)) return IC.adv;
  if(/形容詞/.test(r)) return IC.adj;
  if(/動詞/.test(r)) return IC.verb;
  if(/名詞|主詞|受詞|東西/.test(r)) return IC.noun;
  if(/修飾|片語|子句|介系詞|連接/.test(r)) return IC.link;
  return IC.dot;
}

function twinOf(id){
  var want = /-t$/.test(id) ? id.replace(/-t$/,"") : id+"-t";
  var pool = Q.concat(TWINS);
  for(var i=0;i<pool.length;i++) if(pool[i].id===want) return pool[i];
  return null;
}

var SP = {ok: typeof window!=="undefined" && "speechSynthesis" in window, voices:[], warned:false};
var PREF_KEY="toeic-voice-v1";
var pref = (function(){ try{ var s=localStorage.getItem(PREF_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } })() || {rate:0.9, voice:""};
function savePref(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(pref)); }catch(e){} }
function loadVoices(){
  if(!SP.ok) return;
  var vs = window.speechSynthesis.getVoices() || [];
  SP.voices = vs.filter(function(v){ return /^en[-_]/i.test(v.lang) || v.lang==="en"; });
}
if(SP.ok){ loadVoices(); if(window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", loadVoices); else window.speechSynthesis.onvoiceschanged = loadVoices; }
function accentName(lang){
  var l=(lang||"").toLowerCase().replace("_","-");
  if(l.indexOf("en-us")===0) return "美國"; if(l.indexOf("en-gb")===0) return "英國";
  if(l.indexOf("en-au")===0) return "澳洲"; if(l.indexOf("en-ca")===0) return "加拿大";
  if(l.indexOf("en-in")===0) return "印度"; if(l.indexOf("en-ie")===0) return "愛爾蘭";
  return "英文";
}
function mainVoice(){
  loadVoices();
  var v=null;
  SP.voices.forEach(function(x){ if(x.name===pref.voice) v=x; });
  if(!v) SP.voices.forEach(function(x){ if(!v && /en[-_]US/i.test(x.lang)) v=x; });
  return v || SP.voices[0] || null;
}
function altVoice(){
  var m=mainVoice(), v=null;
  SP.voices.forEach(function(x){ if(!v && m && x.name!==m.name && accentName(x.lang)!==accentName(m.lang)) v=x; });
  SP.voices.forEach(function(x){ if(!v && m && x.name!==m.name) v=x; });
  return v || m;
}
function splitText(t){
  var parts = String(t).match(/[^.!?]+[.!?]*\s*/g) || [t], out=[];
  parts.forEach(function(p){ p=p.trim(); while(p.length>180){ var cut=p.lastIndexOf(" ",180); if(cut<40) cut=180; out.push(p.slice(0,cut)); p=p.slice(cut).trim(); } if(p) out.push(p); });
  return out;
}
/* items: [{text, alt:bool, onstart:fn}] — must be called from a tap */
function speakSeq(items, done){
  if(!SP.ok){ toast("這個瀏覽器不支援語音，請改用 Safari 或 Chrome。"); return; }
  var syn=window.speechSynthesis; syn.cancel();
  loadVoices();
  if(!SP.voices.length && !SP.warned){ SP.warned=true; toast("這台裝置找不到英文語音，會用預設聲音念，發音可能不準。"); }
  var queue=[];
  items.forEach(function(it){ splitText(it.text).forEach(function(chunk,ci){ queue.push({text:chunk, alt:it.alt, onstart: ci===0?it.onstart:null}); }); });
  var m=mainVoice(), a=altVoice();
  queue.forEach(function(it,i){
    var u=new SpeechSynthesisUtterance(it.text);
    var v = it.alt ? a : m;
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
    u.rate = pref.rate || 0.9;
    if(it.onstart) u.onstart = it.onstart;
    if(i===queue.length-1 && done) u.onend = done;
    syn.speak(u);
  });
}
function speak(text){ speakSeq([{text:text}]); }
function stopSpeak(){ if(SP.ok) window.speechSynthesis.cancel(); }
function sayBtn(text,label){
  var b=el("button","say",'🔊'+(label?' <span>'+label+'</span>':'')); b.type="button";

  return b;
}

function toast(msg){

/* ---------- tiles ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function tileHTML(c, o){
  o=o||{};
  if(typeof c==="string"){
    if(c==="+"||c==="="||c==="→"||c==="｜") return '<span class="plus">'+c+'</span>';
    return '<span class="tile"><span class="w">'+esc(c)+'</span>'+(o.roles?'<span class="r">&nbsp;</span>':'')+'</span>';
  }
  var cls=["tile"], text=c.t, role=c.r;
  if(c.slot){
    if(o.fill!=null){ cls.push(o.fillClass||"ans"); text=o.fill; role=o.fillRole||c.r; }
    else { cls.push("slot"); text="？"; role=o.roles?c.r:""; }
  }
  if(c.clue && o.clues) { cls.push("clue"); }
  if(c.kw) cls.push("kw");
  if(c.core) cls.push("core");
  if(c.mod) cls.push("mod");
  if(c.sv) cls.push("sv");
  var showRole = o.roles || (c.clue && o.clues);
  var r = "";
  if(showRole && role){ var lab = (c.clue && o.clues && !o.roles) ? "看這裡" : role; r='<span class="r">'+iconFor(lab)+esc(lab)+'</span>'; }
  else if(o.roles) r='<span class="r">&nbsp;</span>';
  var pair = c.pair ? ' <span class="pair">'+c.pair+'</span>' : '';
  return '<span class="'+cls.join(" ")+'"><span class="w">'+esc(text)+pair+'</span>'+r+'</span>';
}
function rowHTML(arr,o){ return '<div class="tiles">'+arr.map(function(c){ return tileHTML(c,o); }).join("")+'</div>'; }
function ruleHTML(q){ return '<div class="ruleline">'+q.rule.map(function(c){ return tileHTML(c,{roles:false}); }).join("")+'</div>'; }

function satQuestions(){
  var out=[];
  state.book.forEach(function(b){
    if(b.fixed && b.fixedOn!==today()) return;
    var t=twinOf(b.id); if(!t) return;
    var cp={}; for(var k in t) cp[k]=t[k];

    out.push(cp);
  });
  return out;
}

  var list=el("div","vlist"); box.appendChild(list);
  var m=mainVoice();
  SP.voices.forEach(function(v){
    var r=el("label","vitem",'<input type="radio" name="voice"'+(m&&m.name===v.name?' checked':'')+'> <span><b>'+accentName(v.lang)+'</b>　'+esc(v.name)+' <span class="small">('+esc(v.lang)+')</span></span>');
    r.querySelector("input").addEventListener("change",function(){ pref.voice=v.name; savePref(); speak("Hello. This is your TOEIC practice voice."); });
    list.appendChild(r);
  });
  var row=el("div","row");
  var t=el("button","btn primary","▶ 試聽"); t.type="button";
  t.addEventListener("click",function(){ speakSeq([{text:"When does the meeting start?"},{text:"At ten o'clock.",alt:true}],function(){ render(); }); });
  row.appendChild(t); box.appendChild(row);
  var acc={}; SP.voices.forEach(function(v){ acc[accentName(v.lang)]=1; });
  box.appendChild(el("p","small","這台裝置找得到的口音："+(Object.keys(acc).join("、")||"無")+"。多益會出現美國、英國、加拿大、澳洲四種口音。"));
}


function stemText(q){
  var src = q.sent || q.orig || [];
  return src.map(function(c){ return typeof c==="string"?c:(c.slot?"______":c.t); }).join(" ");
}
function segChunks(q){
  if(q.seg) return q.seg;
  return (q.sent||[]).map(function(c){ if(typeof c==="string") return {t:c}; if(c.slot){ var o={}; for(var k in c) o[k]=c[k]; o.t="______"; return o; } return c; });
}
/* words + which gaps are required / optional */
function segModel(q){
  var ch=segChunks(q), words=[], req={}, opt={};
  ch.forEach(function(c,ci){
    var ws=String(c.t).split(/\s+/).filter(function(x){return x;});
    ws.forEach(function(w){ words.push(w); });
    var g=words.length-1;
    if(ci<ch.length-1){ if(c.join) opt[g]=1; else req[g]=1; }
  });
  return {chunks:ch, words:words, req:req, opt:opt};
}

function renderQ(q,num){
  var K=q.key||q.id; var a=state.answers[K]||{tries:0,picked:[],done:false,first:false,guessed:false,open:false,trim:false,phase:"",cuts:[]};
  if(!a.cuts) a.cuts=[];
  state.answers[K]=a;
  var box=el("article","q");
  box.appendChild(el("div","qtop",'<span class="qnum">第 '+num+' 題'+(q.label?'・'+q.label:'')+(q.originId?'・孿生題':'')+'</span><span class="tags"><span class="tag">'+q.tag+'</span><span class="tag lv">'+LEVELS[q.lv||1]+'</span></span>'));
  if(q.passage && current==="sat") box.appendChild(el("div","passage",PASSAGES[q.passage]));

  /* plain stem — no tiles before the answer */
  if(q.type==="blank") box.appendChild(el("div","stem",esc(stemText(q)).replace("______",'<span class="gap-line">______</span>')));
  else if(q.type==="main"||q.type==="para"){ box.appendChild(el("div","stem","<em>"+esc(stemText(q))+"</em>")); box.appendChild(el("div","ask",q.ask)); }
  else if(q.type==="trans") box.appendChild(el("div","ask","選出放進空格 (2) 的字："));
  else if(q.type==="listen"||q.type==="talk"){
    var pb=el("div","playbar");
    var pl=el("button","btn primary",q.type==="talk"?"▶ 播放廣播":"▶ 播放題目和選項"); pl.type="button";
    pl.addEventListener("click",function(){ speakSeq(playItems(q)); });
    pb.appendChild(pl); pb.appendChild(rateChips());
    box.appendChild(pb);
    box.appendChild(el("div","ask",q.type==="talk"?"聽完廣播，回答下面的問題：":"聽一句問句和三個回應，選出最適合的回應。題目不會顯示文字，跟真正的考試一樣。"));
    if(q.type==="talk") box.appendChild(el("div","stem",esc(q.ask)));
  }
  else box.appendChild(el("div","stem",esc(q.ask)));

  /* options */
  var long = q.type!=="blank" && q.type!=="trans" && q.type!=="listen";
  var locked = a.phase==="seg";
  var opts=el("div","opts"+(long?" long":""));
  q.opts.forEach(function(t,i){
    var hide = q.type==="listen" && !a.done;
    var b=el("button","opt",'<span class="k">'+L[i]+'</span><span>'+(hide?'選項 '+L[i]:esc(t))+'</span>'); b.type="button";
    if(a.picked.indexOf(i)>=0 && i!==q.ans){ b.classList.add("wrong"); b.disabled=true; }
    if(a.done){ b.disabled=true; if(i===q.ans) b.classList.add("right"); }
    if(locked) b.disabled=true;
    b.addEventListener("click",function(){ choose(q,i); });
    opts.appendChild(b);
  });
  box.appendChild(opts);

  var fb=el("div","explain"); box.appendChild(fb);
  if(!a.done && a.tries===1) fb.appendChild(segPanel(q,a));
  if(a.done){
    var st=el("div","status");
    if(a.first && !a.guessed){
      st.appendChild(el("span","pill good","✔ 答對了"));
      var g=el("button","btn","我是猜的"); g.type="button";
      g.addEventListener("click",function(){ a.guessed=true; a.open=true; logBook(q,"猜對"); save(); render(); });
      st.appendChild(g);
      if(!a.open){ var s=el("button","btn","看字卡解說"); s.type="button"; s.addEventListener("click",function(){ a.open=true; save(); render(); }); st.appendChild(s); }
    } else {
      st.appendChild(el("span","pill miss",a.guessed?"已記進錯題本（猜的也要複習）":"正解是 "+L[q.ans]+"，已記進錯題本"));
    }
    fb.appendChild(st);
    if(a.open || !a.first || a.guessed) explain(q,a,fb);
  }
  return box;
}

/* ---------- step after a wrong answer: cut the sentence into word cards ---------- */
function segPanel(q,a){
  var m=segModel(q);
  var p=el("div","panel hint");
  if(a.phase==="seg"){
    p.appendChild(el("h4","",'✂️ 先把句子切成字卡，再選一次'));
    p.appendChild(el("ol","steps",'<li><b>點一下單字</b>，就會在它<b>後面</b>切一刀 ✂</li><li>同一組的字會圍在同一張卡片裡</li><li>切錯了？再點一次那個字就能取消</li>'));
    p.appendChild(el("div","example",'<span class="exlab">例子</span><span class="grp g0"><span class="wv">The manager</span></span><span class="scis">✂</span><span class="grp g1"><span class="wv">explained</span></span><span class="scis">✂</span><span class="grp g0"><span class="wv">the new budget</span></span>'));
    var cutBox=el("div","cutter2"); p.appendChild(cutBox);
    var cuts=a.cuts.slice().sort(function(x,y){return x-y;});
    var gi=0, grp=el("span","grp g0");
    cutBox.appendChild(grp);
    m.words.forEach(function(w,i){
      var last = i===m.words.length-1;
      var on = a.cuts.indexOf(i)>=0;
      var b=el("button","wbtn"+(w.indexOf("______")===0?" blankw":""),esc(w)); b.type="button";
      if(last){ b.disabled=true; b.title="最後一個字後面不用切"; }
      else{
        b.setAttribute("aria-pressed",on?"true":"false");
        b.setAttribute("aria-label",w+(on?"，後面已切開，點一下取消":"，點一下在後面切開"));
        b.addEventListener("click",function(){ var k=a.cuts.indexOf(i); if(k>=0) a.cuts.splice(k,1); else a.cuts.push(i); save(); render(); });
      }
      grp.appendChild(b);
      if(on && !last){
        cutBox.appendChild(el("span","scis","✂"));
        gi++; grp=el("span","grp g"+(gi%2)); cutBox.appendChild(grp);
      }
    });
    var row=el("div","row");
    var chk=el("button","btn primary","檢查斷句"); chk.type="button";
    chk.addEventListener("click",function(){ a.phase="segdone"; save(); render(); });
    var clr=el("button","btn","全部清除"); clr.type="button";
    clr.addEventListener("click",function(){ a.cuts=[]; save(); render(); });
    row.appendChild(chk); row.appendChild(clr);
    row.appendChild(el("span","small","目前切成 "+(a.cuts.length+1)+" 張字卡"));
    p.appendChild(row);
  } else {
    /* compare */
    var reqN=0, hit=0, extra=0;
    Object.keys(m.req).forEach(function(g){ reqN++; if(a.cuts.indexOf(+g)>=0) hit++; });
    a.cuts.forEach(function(g){ if(!m.req[g] && !m.opt[g]) extra++; });
    p.appendChild(el("h4","",'✂️ 斷句對照：你切對了 '+hit+' / '+reqN+' 刀'+(extra?'，多切了 '+extra+' 刀':'')));
    var cmp=el("div","cutter cmp"); p.appendChild(cmp);
    m.words.forEach(function(w,i){
      cmp.appendChild(el("span","cw"+(w.indexOf("______")===0?" blankw":""),esc(w)));
      if(i<m.words.length-1){
        var cut=a.cuts.indexOf(i)>=0, need=!!m.req[i], ok=!!m.opt[i];
        var cls="mark", txt="";
        if(need&&cut){ cls+=" hit"; txt="｜"; }
        else if(need){ cls+=" miss"; txt="｜"; }
        else if(cut&&ok){ cls+=" hit"; txt="｜"; }
        else if(cut){ cls+=" extra"; txt="✕"; }
        if(txt) cmp.appendChild(el("span",cls,txt)); else cmp.appendChild(el("span","sp"," "));
      }
    });
    p.appendChild(el("div","legend2",'<span class="m hit">｜切對</span><span class="m miss">｜漏切</span><span class="m extra">✕ 不用切</span>'));
    p.appendChild(el("div","sub2","正確的字卡分法（黃色是解題關鍵）："));
    p.appendChild(el("div","",rowHTML(m.chunks,{roles:true,clues:true})));
    p.appendChild(el("div","small","斷句沒有唯一標準，重點是看出哪幾個字是一組。"));
    p.appendChild(el("div","hinttext",'💡 '+esc(q.hint)));
    p.appendChild(el("div","sub2","看完字卡，在上面再選一次答案。"));
  }
  return p;
}

function transHTML(q,solved){
  var w=el("div","flow");
  w.innerHTML='<div class="scard"><span class="mood '+q.a.mood+'">'+q.a.m+'</span>'+esc(q.a.t)+'</div>'+
    '<div class="link"><span class="w">'+(solved?esc(q.opts[q.ans]):"？")+'</span><span class="r">'+(solved?"轉折 ↷":"方向？")+'</span></div>'+
    '<div class="scard"><span class="mood '+q.b.mood+'">'+q.b.m+'</span>'+esc(q.b.t)+'</div>';
  return w;
}

function explain(q,a,fb){
  /* 1. core rule (red) */
  var core=el("div","panel core-p",'<h4>❗ 核心：記住這組字卡</h4>');
  core.appendChild(el("div","",ruleHTML(q)));
  core.appendChild(el("div","small",esc(q.ruleNote)));
  fb.appendChild(core);

  /* 2. tile breakdown (green) */
  var why=el("div","panel why",'<h4>🔍 字卡拆解：為什麼是這個答案</h4>');
  var full = q.type==="blank" ? stemText(q).replace("______",q.opts[q.ans]) : (q.type==="main"||q.type==="para") ? stemText(q) : (q.type==="trans" ? q.a.t+" "+q.opts[q.ans]+", "+q.b.t : "");
  if(full){ var sr=el("div","row"); sr.appendChild(sayBtn(full,"聽整句")); why.appendChild(sr); }
  if(q.type==="listen"||q.type==="talk"){
    why.appendChild(el("div","sub",q.type==="talk"?"廣播內容：":"題目念的是："));
    var tr0=el("div","row"); tr0.appendChild(sayBtn(q.say,"再聽一次")); tr0.appendChild(el("span","en",esc(q.say))); why.appendChild(tr0);
    why.appendChild(el("div","sub",q.type==="talk"?"關鍵句拆成字卡：":"拆成字卡，先抓第一張："));
    why.appendChild(el("div","",rowHTML(q.seg,{roles:true,clues:true})));
    why.appendChild(el("div","sub","每個選項："));
    q.opts.forEach(function(o,k){
      var r=el("div","tryrow"); var line=el("div","row");
      if(q.type==="listen") line.appendChild(sayBtn(o));
      line.appendChild(el("span","en",(k===q.ans?'✔ ':'✕ ')+L[k]+'. '+esc(o)));
      r.appendChild(line);
      r.appendChild(el("div","because",k===q.ans?'<b class="ok-b">✔</b><span>這是正確的回應。</span>':'<b>✕</b><span>'+esc(q.why[k])+'</span>'));
      why.appendChild(r);
    });
  } else if(q.type==="blank"){
    why.appendChild(el("div","sub","正解放進去，每張字卡的角色："));
    why.appendChild(el("div","",rowHTML(q.sent,{roles:true,fill:q.opts[q.ans],fillClass:"ans",fillRole:q.role[q.ans]})));
    why.appendChild(el("div","sub","把其他選項放進去試試："));
    var si=-1; q.sent.forEach(function(c,i){ if(c.slot) si=i; });
    Object.keys(q.why).forEach(function(k){
      var mini=[]; if(si>0) mini.push(q.sent[si-1]); mini.push(q.sent[si]); if(si<q.sent.length-1) mini.push(q.sent[si+1]);
      var tr=el("div","tryrow");
      tr.appendChild(el("div","",rowHTML(mini,{roles:true,fill:q.opts[k],fillClass:"bad",fillRole:q.role[k]})));
      tr.appendChild(el("div","because",'<b>✕</b><span>'+esc(q.why[k])+'</span>'));
      why.appendChild(tr);
    });
  } else if(q.type==="main"){
    why.appendChild(el("div","sub","按下按鈕，把修飾的字卡拿掉："));
    var holder=el("div",a.trim?"trimmed":"",rowHTML(q.sent,{roles:true}));
    why.appendChild(holder);
    var tb=el("button","btn primary",a.trim?"放回修飾字卡":"拿掉修飾字卡"); tb.type="button";
    tb.addEventListener("click",function(){ a.trim=!a.trim; holder.className=a.trim?"trimmed":""; tb.textContent=a.trim?"放回修飾字卡":"拿掉修飾字卡"; save(); });
    why.appendChild(el("div","row")).appendChild(tb);
    why.appendChild(el("div","sub","其他選項錯在哪："));
    Object.keys(q.why).forEach(function(k){ why.appendChild(el("div","tryrow",'<div class="because"><b>✕</b><span><span class="en">'+esc(q.opts[k])+'</span>：'+esc(q.why[k])+'</span></div>')); });
  } else if(q.type==="trans"){
    why.appendChild(el("div","sub","前後兩句的方向："));
    why.appendChild(transHTML(q,true));
    why.appendChild(el("div","sub","把其他選項放進去試試："));
    Object.keys(q.why).forEach(function(k){
      var tr=el("div","tryrow");
      tr.appendChild(el("div","",rowHTML([{slot:1}],{roles:true,fill:q.opts[k],fillClass:"bad",fillRole:q.role[k]})));
      tr.appendChild(el("div","because",'<b>✕</b><span>'+esc(q.why[k])+'</span>'));
      why.appendChild(tr);
    });
  } else {
    var src = q.locate || q.orig;
    why.appendChild(el("div","sub",q.locate?"文章裡的這一句：":"原句："));
    why.appendChild(el("div","",rowHTML(src,{})));
    why.appendChild(el("div","sub","正確選項（同樣號碼＝同一個意思）："));
    why.appendChild(el("div","",rowHTML(q.alt.map(function(c){ return typeof c==="string"?c:{t:c.t,pair:c.pair,core:1}; }),{})));
    why.appendChild(el("div","sub","其他選項錯在哪："));
    Object.keys(q.why).forEach(function(k){ why.appendChild(el("div","tryrow",'<div class="because"><b>✕</b><span><span class="en">'+esc(q.opts[k])+'</span>：'+esc(q.why[k])+'</span></div>')); });
  }
  fb.appendChild(why);

  var d=el("details","more",'<summary>看完整說明</summary><div class="body">'+q.more+'</div>');
  fb.appendChild(d);
}

function choose(q,i){
  var a=state.answers[q.key||q.id]; if(a.done||a.phase==="seg") return;
  if(i===q.ans){
    a.done=true; a.first=(a.tries===0); a.phase="";
    if(!a.first) logBook(q,"答錯");
    else if(q.originId){ state.book.forEach(function(b){ if(b.id===q.originId){ b.fixed=true; b.fixedOn=today(); } }); }
  } else {
    if(a.picked.indexOf(i)<0) a.picked.push(i);
    a.tries++;
    if(a.tries===1){ a.phase="seg"; a.cuts=[]; }
    if(a.tries>=2){ a.done=true; a.first=false; a.phase=""; logBook(q,"答錯"); }
  }
  save(); render();
}

/* ---------- book & backup ---------- */
function renderBook(){
  main.appendChild(el("div","dayhead",'<div class="badge" style="background:var(--red)">!</div><div><h2>錯題本</h2><p>答錯和「我是猜的」都會記在這裡。週六答對同考點的新題，就會移走。</p></div>'));
  var items=openBook();
  if(!items.length){ main.appendChild(el("p","small","目前沒有錯題。")); return; }
  var list=el("div","book"); main.appendChild(list);
  items.forEach(function(b){
    list.appendChild(el("div","bitem",'<span class="lab">考點</span><span>'+esc(b.tag)+'（'+esc(b.kind)+(b.again?'，孿生題也錯了':'')+'）</span><span class="lab">題目</span><span class="en">'+esc(b.text)+'</span><span class="lab">正解</span><span class="en">'+esc(b.answer)+'</span><span class="lab">複習日</span><span class="score">'+b.review.map(function(x){ return x.slice(5).replace("-","/"); }).join("、")+'</span>'));
  });
}
function renderBackup(){
  main.appendChild(el("div","dayhead",'<div class="badge" style="background:var(--blue)">↺</div><div><h2>備份／還原</h2><p>換手機或清除瀏覽器資料前，先複製備份碼存起來，之後貼回來就能還原。</p></div>'));
  var code=""; try{ code=btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }catch(e){}
  var box=el("div","dialog",'<label for="code-out"><b>你的備份碼</b></label><textarea id="code-out" readonly></textarea><div class="row"><button class="btn primary" type="button" id="copy">複製備份碼</button><span class="small" id="copy-msg" role="status"></span></div><label for="code-in"><b>貼上備份碼還原</b></label><textarea id="code-in" placeholder="把之前複製的備份碼貼在這裡"></textarea><div class="row"><button class="btn" type="button" id="restore">還原</button><span class="small" id="restore-msg" role="status"></span></div>');
  main.appendChild(box);
  document.getElementById("code-out").value=code;
  document.getElementById("copy").addEventListener("click",function(){
    var msg=document.getElementById("copy-msg"), ta=document.getElementById("code-out");
    function fb(){ ta.focus(); ta.select(); msg.textContent="已選取，請按複製（Ctrl+C 或長按複製）。"; }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(function(){ msg.textContent="已複製"; },fb); else fb();
  });
  document.getElementById("restore").addEventListener("click",function(){
    var msg=document.getElementById("restore-msg");
    try{ var s=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("code-in").value.trim()))));
      if(!s||typeof s!=="object"||!s.answers) throw new Error("bad");
      state={answers:s.answers,book:s.book||[]}; save(); document.getElementById("book-count").textContent=openBook().length;
      msg.textContent="已還原，回到題目頁就能看到進度。";
    }catch(e){ msg.textContent="這段備份碼讀不出來，請確認有完整貼上。"; }
  });
}

document.getElementById("btn-book").addEventListener("click",function(){ view=view==="book"?"day":"book"; render(); });
document.getElementById("btn-backup").addEventListener("click",function(){ view=view==="backup"?"day":"backup"; render(); });
document.getElementById("btn-voice").addEventListener("click",function(){ view=view==="voice"?"day":"voice"; render(); });
if(isLine()) document.getElementById("linebar").hidden=false;
render();
})();
